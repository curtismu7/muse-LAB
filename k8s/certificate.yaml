# TLS for the app's own host. cert-manager issues it through the SE cluster's DNS-01 ClusterIssuer, letsencrypt-pdo.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __NAME__
spec:
  secretName: __NAME__-tls
  dnsNames:
    - __SE_HOST__
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-pdo
