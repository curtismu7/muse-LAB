name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: SE manifests render (dry run)
        run: IMAGE=registry.invalid/muse:ci SE_HOST=muse.invalid k8s/deploy.sh --dry-run > /dev/null
      - name: Doctor against a local build
        run: |
          # A free port, not 5100: the runner is a shared machine and something else (a local Docker copy of this app) may already hold 5100,
          # which made the doctor check that other copy instead of this build.
          PORT=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          PORT=$PORT node server/src/index.js &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          node scripts/doctor.mjs http://127.0.0.1:$PORT
  secrets:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: PATH="/opt/homebrew/bin:$PATH" gitleaks detect --source . --redact -v
  forbidden-strings:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          list="$HOME/.config/demo-kit/forbidden-strings.txt"
          test -s "$list" || { echo "forbidden-strings list missing on runner"; exit 1; }
          hits=$(git log -p --all | grep -cF -f "$list" || true)
          files=$(grep -rlF -f "$list" --exclude-dir=node_modules --exclude-dir=.git . | wc -l | tr -d ' ')
          echo "history hits: $hits, tree files: $files"
          test "$hits" = "0" && test "$files" = "0"
